name: teleclinic

# Edge: HAProxy (blue/green weights, runtime API), APISIX (API gateway), Keycloak (stand-in for IremboAccount).
services:
  haproxy:
    image: haproxy:3.0.5-alpine
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9080:9080"   # public edge
      - "9404:9404"   # stats page (demo cockpit reads it)
      - "127.0.0.1:9999:9999"   # runtime API (weights) for the release script; local only
    depends_on:
      apisix:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9404/stats >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped
    # interop: the sync gateway (OpenFn) reaches the core pool here, like any other internal caller
    networks: [teleclinic, interop]

  apisix:
    image: apache/apisix:3.11.0-debian
    volumes:
      - ./config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./config/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    healthcheck:
      # The image's /bin/sh is dash, which has no /dev/tcp, so call bash explicitly
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /apisix/ping HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q pong <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
    networks: [teleclinic]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Values substituted into the realm file at import
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - ./config/keycloak/irembo-mock-realm.json:/opt/keycloak/data/import/irembo-mock-realm.json:ro
      - ./config/keycloak/themes/irembo:/opt/keycloak/themes/irembo:ro
    ports:
      - "9180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped
    networks: [teleclinic]

networks:
  # Shared with the EMR project (compose/emr.yml); created by make up-lite and make emr-up
  interop:
    name: teleclinic-interop
    external: true
  teleclinic:
    name: teleclinic
