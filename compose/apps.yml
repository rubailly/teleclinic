# Application tier. core-blue is live; core-green starts only for a release (profile "release").
x-core: &core
  build:
    context: ./services/core
  environment: &core-env
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${OIDC_REALM}
    OIDC_INTERNAL_BASE_URL: http://keycloak:8080/realms/${OIDC_REALM}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
    DB_URL: jdbc:postgresql://postgres:5432/teleclinic
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    # The synthetic demo seed (db/demo) is part of the demo stack only
    FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    KAFKA_BOOTSTRAP: kafka-1:9092
    IREMBOPAY_INTERNAL_URL: http://irembopay-mock:8000
    INSURANCE_INTERNAL_URL: http://irembopay-mock:8000
    IREMBOPAY_CALLBACK_URL: http://haproxy:9080/webhooks/irembopay
    IREMBOPAY_WEBHOOK_SECRET: ${IREMBOPAY_WEBHOOK_SECRET}
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  depends_on:
    keycloak:
      condition: service_healthy
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  mem_limit: 512m
  restart: unless-stopped
  networks: [teleclinic]

services:
  core-blue:
    <<: *core
    image: teleclinic/core:v1.4
    environment:
      <<: *core-env
      RELEASE_COLOR: blue
      RELEASE_VERSION: v1.4

  core-green:
    <<: *core
    image: teleclinic/core:v1.5
    profiles: ["release"]
    environment:
      <<: *core-env
      RELEASE_COLOR: green
      RELEASE_VERSION: v1.5
