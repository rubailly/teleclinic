# Application tier. core-blue is live; core-green starts only for a release (profile "release").
x-core: &core
  build:
    context: ./services/core
  environment: &core-env
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${OIDC_REALM}
    OIDC_INTERNAL_BASE_URL: http://keycloak:8080/realms/${OIDC_REALM}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
    # Always the current Patroni leader, through pgproxy
    DB_URL: jdbc:postgresql://pgproxy:5000/teleclinic
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    # The synthetic demo seed (db/demo) is part of the demo stack only
    FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
    VALKEY_HOST: valkey
    IREMBOPAY_INTERNAL_URL: http://irembopay-mock:8000
    INSURANCE_INTERNAL_URL: http://irembopay-mock:8000
    IREMBOPAY_CALLBACK_URL: http://haproxy:9080/webhooks/irembopay
    IREMBOPAY_WEBHOOK_SECRET: ${IREMBOPAY_WEBHOOK_SECRET}
    PAYMENT_WINDOW: ${PAYMENT_WINDOW}
    MODEL_SERVICE_URL: http://triage-model:8100
    ANONYMIZER_URL: http://anonymizer:8200
    VAULT_KEY: ${VAULT_KEY}
    AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET}
    USSD_GATEWAY_KEY: ${USSD_GATEWAY_KEY}
    SMS_URL: http://ussd-gateway:8300
    TRIAGE_SLA_SCALE: ${TRIAGE_SLA_SCALE}
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  depends_on:
    keycloak:
      condition: service_healthy
    pgproxy:
      condition: service_healthy
    valkey:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  mem_limit: 512m
  restart: unless-stopped
  networks: [teleclinic, ai-zone]

services:
  irembopay-mock:
    build:
      context: ./services/irembopay-mock
    image: teleclinic/irembopay-mock:dev
    environment:
      PUBLIC_URL: ${IREMBOPAY_PUBLIC_URL}
      WEBHOOK_SECRET: ${IREMBOPAY_WEBHOOK_SECRET}
    ports:
      - "9280:8000"   # hosted checkout page the browser is sent to
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped
    networks: [teleclinic]

  ussd-gateway:
    build:
      context: ./services/ussd-gateway
    image: teleclinic/ussd-gateway:dev
    environment:
      CORE_URL: http://haproxy:9100
      USSD_GATEWAY_KEY: ${USSD_GATEWAY_KEY}
      IREMBOPAY_URL: http://irembopay-mock:8000
      VALKEY_HOST: valkey
    ports:
      - "9380:8300"   # aggregator callback and the phone simulator
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped
    networks: [teleclinic]

  core-blue:
    <<: *core
    image: teleclinic/core:v1.4
    environment:
      <<: *core-env
      RELEASE_COLOR: blue
      RELEASE_VERSION: v1.4

  core-green:
    <<: *core
    image: teleclinic/core:v1.5
    profiles: ["release"]
    environment:
      <<: *core-env
      RELEASE_COLOR: green
      RELEASE_VERSION: v1.5
