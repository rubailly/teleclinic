# Facility EMRs and the sync gateway, as deployed in Rwanda:
#   - eBuzima (ERPNext with the Frappe Healthcare app): one central, multi-tenant instance for health centres, where
#     each health centre is a tenant (an ERPNext Company) on the same site;
#   - OpenMRS O3: one installation per hospital (here, one district hospital);
#   - OpenFn Lightning and its worker: the sync gateway between the core and both.
# A separate, long-lived Compose project (make emr-up): both EMRs take minutes to initialise an empty database, so
# `make reset` does not restart them; it puts their demo data back to the seed state through their APIs instead.
# The core works without them, which is also how it behaves when an EMR is offline.
name: teleclinic-emr

x-initializer: &initializer
  # TeleClinic's metadata, beside the distribution's own configuration (nothing upstream is replaced)
  - openmrs-data:/openmrs/data
  - ./config/openmrs/initializer/patientidentifiertypes:/openmrs/distribution/openmrs_config/patientidentifiertypes/teleclinic:ro
  - ./config/openmrs/initializer/encountertypes:/openmrs/distribution/openmrs_config/encountertypes/teleclinic:ro
  - ./config/openmrs/initializer/locations:/openmrs/distribution/openmrs_config/locations/teleclinic:ro
  - ./config/openmrs/initializer/concepts:/openmrs/distribution/openmrs_config/concepts/teleclinic:ro
  - ./config/openmrs/initializer/personattributetypes:/openmrs/distribution/openmrs_config/personattributetypes/teleclinic:ro

x-ebuzima: &ebuzima
  # services/ebuzima/Dockerfile: frappe/erpnext v15.121.4 with the Healthcare app pinned to a commit
  image: teleclinic/ebuzima:v15.121.4-healthcare
  build: ./services/ebuzima
  restart: unless-stopped
  volumes:
    - ebuzima-sites:/home/frappe/frappe-bench/sites
    - ebuzima-logs:/home/frappe/frappe-bench/logs
  networks: [emr]

services:
  # Routes /openmrs/spa to the O3 frontend and /openmrs to the backend
  openmrs:
    image: openmrs/openmrs-reference-application-3-gateway:3.7.x@sha256:8a8c78d6d974d3e071a6e29eb4679b4c84367c58ad16bb8b7dbe0d0a2234a14f
    restart: unless-stopped
    ports:
      - "${PUBLISH_IP:-0.0.0.0}:9880:80"   # OpenMRS O3: http://localhost:9880/openmrs/spa
    depends_on:
      openmrs-frontend: {condition: service_started}
      openmrs-backend: {condition: service_healthy}
    mem_limit: 64m
    networks: [emr]

  openmrs-frontend:
    image: openmrs/openmrs-reference-application-3-frontend:3.7.x@sha256:4cace305966a8b6c23f07b92b83e072e4c4333df8244241469ce8c627241239a
    restart: unless-stopped
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      # The distribution's config, then TeleClinic's (config/openmrs/frontend): home is Patient lists for every role, because the
      # Service queues home page fails in the distribution without demo data (no queues are set up)
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json,/openmrs/spa/config-teleclinic.json
    volumes:
      - ./config/openmrs/frontend/config-teleclinic.json:/usr/share/nginx/html/config-teleclinic.json:ro
    mem_limit: 256m
    networks:
      emr: {aliases: [frontend]}

  openmrs-backend:
    image: openmrs/openmrs-reference-application-3-backend:3.7.x-no-demo@sha256:b5c1cf42283bd3a4b8ead3f0c3b165a7190807a463343f3222a6a3fcd4be7943
    restart: unless-stopped
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: openmrs
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OPENMRS_DB_PASSWORD}
      # The admin password set when the database is first created (the image's default otherwise)
      OMRS_ADMIN_USER_PASSWORD: ${OPENMRS_ADMIN_PASSWORD}
    volumes: *initializer
    depends_on:
      openmrs-db: {condition: service_healthy}
    # Healthy once the REST API authenticates, not when the setup wizard answers
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u admin:${OPENMRS_ADMIN_PASSWORD} http://localhost:8080/openmrs/ws/rest/v1/session | grep -q '\"authenticated\":true'"]
      interval: 15s
      timeout: 10s
      retries: 240
      start_period: 120s
    mem_limit: 2g
    networks:
      emr: {aliases: [backend]}

  openmrs-db:
    image: mariadb:10.11.7
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    networks: [emr]

  # eBuzima stand-in, modelled on frappe_docker's pwd.yml. One site (ebuzima) serves every health centre.
  ebuzima:
    <<: *ebuzima
    command: ["nginx-entrypoint.sh"]
    volumes:
      - ebuzima-sites:/home/frappe/frappe-bench/sites
      - ebuzima-logs:/home/frappe/frappe-bench/logs
      # frappe_docker's template with one change on /socket.io (see the comment there)
      - ./services/ebuzima/frappe.conf.template:/templates/nginx/frappe.conf.template:ro
    environment:
      BACKEND: ebuzima-backend:8000
      SOCKETIO: ebuzima-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ebuzima
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${PUBLISH_IP:-0.0.0.0}:9580:8080"   # eBuzima: http://localhost:9580 (Desk at /app)
    depends_on:
      ebuzima-backend: {condition: service_healthy}
      ebuzima-websocket: {condition: service_started}
      ebuzima-create-site: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/method/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 64m
    # The gateway's worker reaches it as http://ebuzima:8080
    networks:
      emr: {aliases: [ebuzima-web]}

  ebuzima-backend:
    <<: *ebuzima
    depends_on:
      ebuzima-configurator: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -H 'Host: ebuzima' http://localhost:8000/api/method/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g

  # Writes common_site_config.json (database and Redis hosts), then exits
  ebuzima-configurator:
    <<: *ebuzima
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt &&
        bench set-config -g db_host ebuzima-db &&
        bench set-config -gp db_port 3306 &&
        bench set-config -g redis_cache redis://ebuzima-redis-cache:6379 &&
        bench set-config -g redis_queue redis://ebuzima-redis-queue:6379 &&
        bench set-config -g redis_socketio redis://ebuzima-redis-queue:6379 &&
        bench set-config -gp socketio_port 9000
    depends_on:
      ebuzima-db: {condition: service_healthy}

  # Creates the site with ERPNext and Healthcare on first start (several minutes); a no-op after
  ebuzima-create-site:
    <<: *ebuzima
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        if [ -d sites/ebuzima ]; then echo "site ebuzima already exists"; exit 0; fi;
        bench new-site ebuzima
        --mariadb-user-host-login-scope='%'
        --db-root-username root
        --db-root-password "$$DB_ROOT_PASSWORD"
        --admin-password "$$ADMIN_PASSWORD"
        --install-app erpnext
        --install-app healthcare
        --set-default
    environment:
      DB_ROOT_PASSWORD: ${EBUZIMA_DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${EBUZIMA_ADMIN_PASSWORD}
    depends_on:
      ebuzima-configurator: {condition: service_completed_successfully}
      ebuzima-redis-cache: {condition: service_started}
      ebuzima-redis-queue: {condition: service_started}

  ebuzima-websocket:
    <<: *ebuzima
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      ebuzima-configurator: {condition: service_completed_successfully}
    mem_limit: 128m

  # Runs document webhooks (the push to the sync gateway) and other background jobs
  ebuzima-worker:
    <<: *ebuzima
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      ebuzima-create-site: {condition: service_completed_successfully}
    mem_limit: 512m

  ebuzima-scheduler:
    <<: *ebuzima
    command: ["bench", "schedule"]
    depends_on:
      ebuzima-create-site: {condition: service_completed_successfully}
    mem_limit: 256m

  ebuzima-db:
    image: mariadb:10.6.21
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${EBUZIMA_DB_ROOT_PASSWORD}
    volumes:
      - ebuzima-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    networks: [emr]

  ebuzima-redis-cache:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    mem_limit: 64m
    networks: [emr]

  ebuzima-redis-queue:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    volumes:
      - ebuzima-redis-queue-data:/data
    mem_limit: 64m
    networks: [emr]

  # OpenFn Lightning: the sync gateway's workflows (sync/), run by the worker
  openfn:
    image: openfn/lightning:v2.19.0
    restart: unless-stopped
    # The image does not migrate on boot; migrations are idempotent, so run them on every start
    command: ["sh", "-c", "/app/bin/migrate && exec /app/bin/server"]
    environment:
      DATABASE_URL: postgresql://lightning:${OPENFN_DB_PASSWORD}@openfn-db:5432/lightning
      DISABLE_DB_SSL: "true"
      LISTEN_ADDRESS: 0.0.0.0
      PORT: "4000"
      URL_SCHEME: ${OPENFN_SCHEME:-http}
      # The address browsers use: Lightning's live pages refuse websocket origins it does not list
      URL_HOST: ${OPENFN_HOST:-localhost}
      URL_PORT: ${OPENFN_PORT:-9480}
      ORIGINS: ${OPENFN_SCHEME:-http}://${OPENFN_HOST:-localhost}:${OPENFN_PORT:-9480}
      SECRET_KEY_BASE: ${OPENFN_SECRET_KEY_BASE}
      PRIMARY_ENCRYPTION_KEY: ${OPENFN_ENCRYPTION_KEY}
      WORKER_SECRET: ${OPENFN_WORKER_SECRET}
      WORKER_RUNS_PRIVATE_KEY: ${OPENFN_WORKER_RUNS_PRIVATE_KEY}
      LOG_LEVEL: info
    ports:
      - "${PUBLISH_IP:-0.0.0.0}:9480:4000"   # Lightning: http://localhost:9480 (runs, history)
    depends_on:
      openfn-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4000/health_check || wget -qO- http://localhost:4000/health_check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    # The core posts here to start a sync run as soon as there is work
    networks:
      emr: {}
      interop: {aliases: [openfn]}

  openfn-worker:
    image: openfn/ws-worker:v1.29.4
    restart: unless-stopped
    environment:
      WORKER_LIGHTNING_SERVICE_URL: ws://openfn:4000/worker
      WORKER_SECRET: ${OPENFN_WORKER_SECRET}
      WORKER_LOG_LEVEL: info
    depends_on:
      openfn: {condition: service_healthy}
    mem_limit: 768m
    # Reaches both EMRs on the EMR network and the core (through HAProxy) on the interop network
    networks: [emr, interop]

  openfn-db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lightning
      POSTGRES_USER: lightning
      POSTGRES_PASSWORD: ${OPENFN_DB_PASSWORD}
    volumes:
      - openfn-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightning -d lightning"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    networks: [emr]

networks:
  emr: {}
  # Shared with the main project (HAProxy and the core); created by `make emr-up` and `make up-lite`
  interop:
    name: teleclinic-interop
    external: true

volumes:
  openmrs-data:
  openmrs-db-data:
  openfn-db-data:
  ebuzima-sites:
  ebuzima-logs:
  ebuzima-db-data:
  ebuzima-redis-queue-data:
