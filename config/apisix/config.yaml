# APISIX in standalone mode: routes come from apisix.yaml, no etcd and no Admin API.
apisix:
  node_listen: 9080
  enable_admin: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

plugins:
  - request-id
  - limit-count
  - proxy-rewrite
  - response-rewrite
  - fault-injection
  - openid-connect
  - prometheus
