# Routes for the API gateway. Configuration as code: this file is the only source of routes.
upstreams:
  - id: core-pool
    type: roundrobin
    pass_host: pass
    nodes:
      "haproxy:9100": 1

routes:
  # Liveness of the gateway itself, used by HAProxy and make doctor
  - id: gateway-ping
    uri: /apisix/ping
    plugins:
      fault-injection:
        abort:
          http_status: 200
          body: "pong\n"
    upstream_id: core-pool

  # Never expose the core's actuator through the public edge
  - id: block-actuator
    uri: /actuator/*
    priority: 10
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: "not found\n"
    upstream_id: core-pool

  # Callbacks from the AI trust zone reach the core directly, never through the public edge
  - id: block-internal
    uri: /internal/*
    priority: 10
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: "not found\n"
    upstream_id: core-pool

  # The sync gateway delivers EMR changes on the internal network (HAProxy's core pool), never through the public edge
  - id: block-sync-inbound
    uri: /sync/inbound
    priority: 10
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: "not found\n"
    upstream_id: core-pool

  # Everything else goes to the core. The gateway creates the correlation id
  # (or keeps a caller-supplied one, used by the demo's fixed "demo-" prefix).
  - id: core
    uri: /*
    upstream_id: core-pool
    plugins:
      request-id:
        header_name: X-Correlation-Id
        include_in_response: true
        algorithm: uuid
      limit-count:
        count: 1200
        time_window: 60
        # Per client: APISIX itself only sees HAProxy's address, so use the one HAProxy recorded
        key_type: var
        key: http_x_real_ip
        rejected_code: 429
        policy: local
#END
