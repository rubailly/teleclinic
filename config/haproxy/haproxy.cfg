# HAProxy: public edge in front of APISIX, and the blue/green pool behind APISIX.
# Request path: browser -> :9080 (public) -> APISIX -> :9100 (core_pool, blue/green weights) -> core-blue | core-green
# Weights change at runtime through the admin socket (scripts use it for the release scene).

global
    log stdout format raw local0
    stats socket ipv4@0.0.0.0:9999 level admin expose-fd listeners
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    default-server init-addr last,libc,none resolvers docker

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend public
    bind :9080
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Port 9080
    # The client address as HAProxy saw it, overwriting anything the client sent; APISIX rate-limits on it
    http-request set-header X-Real-IP %[src]
    default_backend apisix

backend apisix
    option httpchk GET /apisix/ping
    server apisix1 apisix:9080 check inter 2s

frontend core_pool
    bind :9100
    default_backend core

backend core
    balance roundrobin
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    # No stickiness: sessions are shared in Valkey, so any instance can serve any request
    server core-blue  core-blue:8080  weight 100 check inter 2s fall 2 rise 2
    server core-green core-green:8080 weight 0   check inter 2s fall 2 rise 2

frontend stats
    bind :9404
    stats enable
    stats uri /stats
    stats refresh 5s
