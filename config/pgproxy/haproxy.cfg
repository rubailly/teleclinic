# HAProxy in front of the Patroni cluster (Figure 10).
# :5000 always reaches the current leader (Patroni answers 200 on /primary only there).
# :5001 spreads reads over healthy replicas. A node that fails its check has its sessions cut at once,
# so clients reconnect to the new leader instead of hanging on the old one.

global
    log stdout format raw local0
    maxconn 2000

defaults
    mode tcp
    log global
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s
    default-server init-addr last,libc,none resolvers docker

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

listen primary
    bind :5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-1 pg-1:5432 maxconn 300 check port 8008
    server pg-2 pg-2:5432 maxconn 300 check port 8008
    server pg-3 pg-3:5432 maxconn 300 check port 8008

listen replicas
    bind :5001
    balance roundrobin
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-1 pg-1:5432 maxconn 300 check port 8008
    server pg-2 pg-2:5432 maxconn 300 check port 8008
    server pg-3 pg-3:5432 maxconn 300 check port 8008

frontend stats
    mode http
    bind :7000
    # Prometheus scrapes the same counters the stats page shows
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 2s
