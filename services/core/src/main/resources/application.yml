spring:
  application:
    name: teleclinic-core

server:
  port: 8080
  # Host, scheme and port come from the edge (HAProxy sets X-Forwarded-*; APISIX passes the Host)
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: TCSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"

teleclinic:
  release:
    color: ${RELEASE_COLOR:local}
    version: ${RELEASE_VERSION:dev}
  identity:
    # Public issuer: the URL the browser sees, and the value required in the id token "iss" claim
    issuer: ${OIDC_ISSUER:http://localhost:9180/realms/irembo-mock}
    # Same realm reached from inside the network, for the back-channel token and key calls
    internal-base-url: ${OIDC_INTERNAL_BASE_URL:http://localhost:9180/realms/irembo-mock}
    client-id: ${OIDC_CLIENT_ID:teleclinic-core}
    client-secret: ${OIDC_CLIENT_SECRET:not-set}
