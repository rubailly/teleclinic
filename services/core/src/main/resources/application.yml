spring:
  application:
    name: teleclinic-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teleclinic}
    username: ${DB_USER:teleclinic}
    password: ${DB_PASSWORD:not-set}
    hikari:
      # Fail fast during a leader change so the caller retries with the same Idempotency-Key
      connection-timeout: 5000
      validation-timeout: 2000
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: 6379
      timeout: 2s
  session:
    redis:
      namespace: teleclinic:session
  flyway:
    # One schema per module; modules own their tables (ADR-001)
    schemas: patient_index,consent,consultation,payments,triage,identity,audit,matching,sync
    default-schema: public
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The value serializer is set in code (shared.KafkaJson) with the application's JSON settings
      properties:
        enable.idempotence: true
  modulith:
    # Events stored but not yet sent (crash between commit and publish) go out again on restart.
    # In Spring Modulith 1.2 this key sits directly under spring.modulith.
    republish-outstanding-events-on-restart: true
    events:
      jdbc:
        schema-initialization:
          enabled: true
      externalization:
        enabled: true

server:
  port: 8080
  # Host, scheme and port come from the edge (HAProxy sets X-Forwarded-*; APISIX passes the Host)
  forward-headers-strategy: framework
  # HAProxy lets at most 80 requests in flight per instance (config/haproxy/haproxy.cfg), internal callers included;
  # the spare threads serve its health checks and the metrics scrapes, which bypass that limit
  tomcat:
    threads:
      max: 100
  servlet:
    session:
      timeout: 30m
      cookie:
        name: TCSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # prometheus is scraped on the internal network; the public gateway refuses /actuator/*
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      color: ${RELEASE_COLOR:local}
      version: ${RELEASE_VERSION:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"

teleclinic:
  sync:
    key: ${SYNC_KEY:not-set}
    # The EMRs, by the facility registry's emr_system. Hooks are the gateway's webhook triggers (OpenFn); empty means
    # the gateway's one-minute schedule picks the work up
    targets:
      ebuzima:
        name: eBuzima
        outbound-hook: ${EBUZIMA_OUTBOUND_HOOK:}
        inbound-hook: ${EBUZIMA_INBOUND_HOOK:}
      openmrs-kibagabaga:
        name: OpenMRS, Kibagabaga District Hospital
        outbound-hook: ${OPENMRS_OUTBOUND_HOOK:}
        inbound-hook: ${OPENMRS_INBOUND_HOOK:}
    max-attempts: 10
  audit:
    # kafka: entries go through the outbox to audit.events and one writer appends them to the chain (the stack).
    # direct: appended in the request's own transaction (tests, no Kafka).
    writer: ${AUDIT_WRITER:kafka}
    verify-every: ${AUDIT_VERIFY_EVERY:PT30S}
  release:
    color: ${RELEASE_COLOR:local}
    version: ${RELEASE_VERSION:dev}
    # Rollback drill only (scripts/release/blue-green.sh --fault-rate): share of API calls that fail on purpose
    fault-rate: ${RELEASE_FAULT_RATE:0}
  identity:
    # Public issuer: the URL the browser sees, and the value required in the id token "iss" claim
    issuer: ${OIDC_ISSUER:http://localhost:9180/realms/irembo-mock}
    # Same realm reached from inside the network, for the back-channel token and key calls
    internal-base-url: ${OIDC_INTERNAL_BASE_URL:http://localhost:9180/realms/irembo-mock}
    client-id: ${OIDC_CLIENT_ID:teleclinic-core}
    client-secret: ${OIDC_CLIENT_SECRET:not-set}
  payments:
    # IremboPay (labelled mock in the demo). Server-to-server calls use the internal URL.
    base-url: ${IREMBOPAY_INTERNAL_URL:http://localhost:8000}
    webhook-secret: ${IREMBOPAY_WEBHOOK_SECRET:not-set}
    # Where IremboPay sends webhooks: through the public edge, like any external caller
    callback-url: ${IREMBOPAY_CALLBACK_URL:http://localhost:9080/webhooks/irembopay}
    signature-tolerance: 5m
  consultation:
    # Illustrative fee in RWF; real tariffs are out of scope (Section 2.1)
    fee: 3000
    currency: RWF
    payment-window: ${PAYMENT_WINDOW:10m}
    timer-interval: PT15S   # ISO-8601: @Scheduled does not accept "15s"
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:9080}
  triage:
    model-service-url: ${MODEL_SERVICE_URL:http://localhost:8100}
    anonymizer-url: ${ANONYMIZER_URL:http://localhost:8200}
    vault-key: ${VAULT_KEY:not-set}
    callback-secret: ${AI_CALLBACK_SECRET:not-set}
    callback-tolerance: 5m
    # Review deadlines are multiplied by this; the demo uses a small value to show the timeout
    sla-scale: ${TRIAGE_SLA_SCALE:1.0}
  channels:
    # Shared with the USSD gateway (internal network only; production uses mTLS)
    gateway-key: ${USSD_GATEWAY_KEY:not-set}
  notifications:
    # The telecom aggregator's SMS API; in the demo the USSD gateway stands in for it
    sms-url: ${SMS_URL:http://localhost:8300}
    sms-key: ${USSD_GATEWAY_KEY:not-set}
  insurance:
    # National insurance coverage check (CBHI/Mutuelle, RSSB). A labelled mock in the demo (assumption A12).
    base-url: ${INSURANCE_INTERNAL_URL:http://localhost:8000}
